<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fundo do Favicon -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b2b" />
      <stop offset="100%" stop-color="#080312" />
    </linearGradient>

    <!-- Gradiente do Brilho da Estrela -->
    <radialGradient id="star-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Gradiente do Texto (Efeito Pincel Roxo Vibrante) -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b877ff" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>

    <!-- Padrão Reticulado (Half-tone Comics) -->
    <pattern id="halftone" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2.2" fill="#d8b4fe" opacity="0.35" />
    </pattern>
  </defs>

  <!-- Base Arredondada (Favicon App Icon Shape) -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bg-grad)" stroke="#a855f7" stroke-width="8" stroke-opacity="0.4" />

  <!-- Brilho ao Redor da Estrela -->
  <circle cx="256" cy="256" r="210" fill="url(#star-glow)" />

  <!-- Estrela de Fundo (Central Geek) -->
  <g transform="translate(256,256)">
    <!-- Polígono Principal da Estrela Geek -->
    <path d="M 0,-215 L 28,-35 L 210,-75 L 48,15 L 175,185 L 12,50 L -45,215 L -25,35 L -205,50 L -42,-20 Z" fill="#8b5cf6" stroke="#e9d5ff" stroke-width="7" stroke-linejoin="round" />
    
    <!-- Superposição com Padrão Halftone de Quadrinhos -->
    <path d="M 0,-215 L 28,-35 L 210,-75 L 48,15 L 175,185 L 12,50 L -45,215 L -25,35 L -205,50 L -42,-20 Z" fill="url(#halftone)" />
  </g>

  <!-- Iniciais "CG" estilo Brush/Comic -->
  <g fill="url(#text-grad)" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Letra 'C' -->
    <path d="M 220,185 C 200,165 165,160 135,180 C 95,205 80,265 90,315 C 100,365 140,390 185,385 C 215,380 235,355 240,335 C 242,325 225,320 215,328 C 190,348 145,350 130,315 C 118,285 125,230 155,205 C 175,190 205,195 215,208 C 222,216 230,195 220,185 Z" />

    <!-- Letra 'G' -->
    <path d="M 390,185 C 370,165 330,160 300,180 C 260,205 245,265 255,315 C 265,365 305,390 350,385 C 390,380 415,345 415,300 L 415,280 L 330,280 C 320,280 320,298 330,298 L 392,298 L 392,305 C 392,335 370,362 342,365 C 310,368 280,348 273,315 C 264,275 278,220 310,198 C 330,185 365,188 380,208 C 388,218 398,193 390,185 Z" />
    
  </g>

  <!-- Detalhes Internos para efeito de textura -->
  <g fill="#ffffff" opacity="0.6">
    <path d="M 140,195 C 165,180 195,185 208,198 C 200,190 170,185 140,195 Z" />
    <path d="M 305,195 C 330,180 360,185 373,198 C 365,190 335,185 305,195 Z" />
  </g>
</svg>